<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>

    <main class="divider">
      <section class="products">
        <h2>Review &amp; Place your Order</h2>

        <form id="checkout-form" name="checkout">
          <fieldset>
            <legend>Customer Information</legend>

            <label for="fname">First Name</label>
            <input
              type="text"
              id="fname"
              name="fname"
              required
              minlength="2"
            />

            <label for="lname">Last Name</label>
            <input
              type="text"
              id="lname"
              name="lname"
              required
              minlength="2"
            />

            <label for="street">Street Address</label>
            <input type="text" id="street" name="street" required />

            <label for="city">City</label>
            <input type="text" id="city" name="city" required />

            <label for="state">State</label>
            <input
              type="text"
              id="state"
              name="state"
              required
              minlength="2"
              maxlength="2"
              title="Two-letter state abbreviation, e.g. ID"
            />

            <label for="zip">Zip Code</label>
            <input
              type="text"
              id="zip"
              name="zip"
              required
              pattern="[0-9]{5}"
              maxlength="5"
              title="Five-digit ZIP code"
            />
          </fieldset>

          <fieldset>
            <legend>Payment</legend>

            <label for="cardNumber">Credit Card Number</label>
            <input
              type="text"
              id="cardNumber"
              name="cardNumber"
              required
              pattern="[0-9]{13,16}"
              title="13–16 digits, no spaces"
            />

            <label for="expiration">Expiration Date</label>
            <input
              type="text"
              id="expiration"
              name="expiration"
              required
              placeholder="MM/YY"
              pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
              title="MM/YY format"
            />

            <label for="code">Security Code</label>
            <input
              type="text"
              id="code"
              name="code"
              required
              pattern="[0-9]{3,4}"
              title="3 or 4 digits"
            />
          </fieldset>

          <button type="submit" class="checkout-button">Submit Order</button>
        </form>
      </section>

      <section class="order-summary">
        <h2>Order Summary</h2>
        <p>Subtotal: $<span id="subtotal">0.00</span></p>
        <p>Tax: $<span id="tax">0.00</span></p>
        <p>Shipping: $<span id="shipping">0.00</span></p>
        <p class="order-total">Total: $<span id="order-total">0.00</span></p>
      </section>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
